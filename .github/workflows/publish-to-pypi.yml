name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Build
      run: uv build
    - name: Publish to PyPI
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.pypi_token }}
      run: uv publish --check-url https://pypi.org/simple/
      continue-on-error: true
